# Tìm dường dài cho Warthog Robot
global_costmap:
   global_frame: map
   robot_base_frame: base_link

   update_frequency: 2.0  #10.0    #20.0
   publish_frequency: 1.0  #5.0    #5.0

   # width: 40.0
   # height: 40.0

   resolution: 0.1   #0.05
   # origin_x: -20.0
   # origin_y: -20.0
   static_map: true    # Sử dụng bản đồ tĩnh
   rolling_window: false   # Không di chuyển theo robot

   plugins:
   - {name: static_layer, type: "costmap_2d::StaticLayer"}
   - {name: obstacles_layer, type: "costmap_2d::ObstacleLayer"}
   - {name: inflater_layer, type: "costmap_2d::InflationLayer"}
