# Các tham số chung cho cả costmap toàn cục (global) và costmap cục bộ (local)
obstacle_range: 10.0
raytrace_range: 10.0

footprint: [[-0.85, -0.75], [-0.85, 0.75], [0.85, 0.75], [0.85, -0.75]]
footprint_padding: 0.1

plugins:
- {name: obstacles_layer, type: "costmap_2d::ObstacleLayer"}
- {name: inflater_layer, type: "costmap_2d::InflationLayer"}

# =========================================================
# Cái này là cho mô phỏng, chạy mô phỏng thì bật lên 
# =========================================================
# obstacles_layer:
#   observation_sources: scan
#   scan: { 
#           sensor_frame: front_laser, 
#           data_type: LaserScan, 
#           topic: /front/scan,
#           marking: true, 
#           clearing: true
#         }


# =========================================================
# Cái này là cho chạy thật 
# =========================================================
obstacles_layer:
  observation_sources: scan
  scan:
    sensor_frame: base_link
    data_type: LaserScan
    topic: /scan
    marking: true
    clearing: true
    expected_update_rate: 0.0
    observation_persistence: 0.0
    min_obstacle_height: 0.1
    max_obstacle_height: 1.5

cost_scaling_factor: 5.0  #3.0 - ưu tiên đường “an toàn”
resolution: 0.1
lethal_cost_threshold: 100
robot_base_frame: base_link
transform_tolerance: 0.3

inflater_layer:
 inflation_radius: 0.9 # không chạy sát vật cản, vùng an toàn quanh vật cản
